name: Tests

on:
  push:
    paths: ["arxiv_digest/**", "tests/**", "pyproject.toml", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["arxiv_digest/**", "tests/**", "pyproject.toml", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest
